<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Post 1:1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=block" rel="stylesheet">
  <!-- Plantilla de marca Gragica · brand/applications/SOCIAL.md
       Editá SOLO el bloque #piece. Render: node scripts/brand/render.mjs brand/assets/templates/post-1x1.html -->
  <script type="application/json" id="piece">
  {
    "format": "post-1x1",
    "width": 1080,
    "height": 1080,
    "level": 3,
    "structure": "C",
    "goal": "Dar un dato concreto de Gragi",
    "audience": "direccion",
    "eyebrow": "Gragi",
    "headline": "Gragi responde en 10 segundos.",
    "remate": "10 segundos.",
    "lead": "Lo que tarda Gragi en decirte qué cursos bajaron el promedio este trimestre.",
    "caption": "Fuente: Gragica, colegio de demostración.",
    "background": "paper",
    "evidence": {
      "type": "sourced-figure",
      "figure": "10 segundos",
      "source": "Gragica, colegio de demostración (medición interna, a verificar antes de publicar)"
    },
    "headline_break": true
  }
  </script>
  <style>
    :root {
      /* Tokens de marca (brand/tokens/semantic.tokens.json). Único lugar con valores de color. */
      --brand-primary: #2F6F2A;
      --brand-primary-on-dark: #5BAE66;
      --brand-night: #0D1C0D;
      --brand-on-night: #CAD8CA;
      --brand-accent: #C98E18;
      --brand-accent-on-night: #EAB448;
      --surface-page: #FCFDFC;
      --surface-raised: #FFFFFF;
      --surface-sunken: #F3F7F2;
      --border: #E0E7DF;
      --text-primary: #1F2023;
      --text-secondary: #4E5156;
      --text-muted: #61656B;
      --on-primary: #FFFFFF;
      --on-night-strong: #FFFFFF;
      --rule-on-night: rgb(255 255 255 / 0.14);
      --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --font-sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius-card: 14px;
      --radius-control: 10px;
      --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: var(--w); height: var(--h); overflow: hidden; }
    body { font-family: var(--font-sans); color: var(--text-primary); background: var(--surface-page);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
    body.night { background: var(--brand-night); color: var(--brand-on-night); }
    body.sunken { background: var(--surface-sunken); }
    .eyebrow { font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: var(--brand-primary); }
    .night .eyebrow { color: var(--brand-primary-on-dark); }
    .headline { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.025em; line-height: 1.04; }
    .headline .remate { color: var(--brand-primary); }
    .night .headline { color: var(--on-night-strong); }
    .night .headline .remate { color: var(--brand-primary-on-dark); }
    .lead { color: var(--text-secondary); line-height: 1.45; }
    .night .lead { color: var(--brand-on-night); }
    .caption { color: var(--text-muted); line-height: 1.4; }
    .night .caption { color: var(--brand-on-night); opacity: .8; }
    .frame { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-card);
             box-shadow: var(--shadow-card); overflow: hidden; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
    .cta { display: inline-flex; align-items: center; font-weight: 600; background: var(--brand-primary);
           color: var(--on-primary); border-radius: var(--radius-control); }

    /* --- composición de este formato --- */
    .wrap { position: absolute; inset: 0; padding: 80px; display: flex; flex-direction: column; }
    .eyebrow { font-size: 22px; }
    h1.headline { margin-top: auto; font-size: 104px; }
    .headline .remate { display: block; font-size: 172px; line-height: .95; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .figure-unused { font-family: var(--font-serif); font-weight: 600; font-size: 260px; line-height: .9;
              letter-spacing: -0.04em; color: var(--brand-primary); font-variant-numeric: tabular-nums; }
    .unit { font-family: var(--font-sans); font-weight: 600; font-size: 64px; letter-spacing: 0; color: var(--text-primary); margin-left: 16px; }
    .night .unit { color: var(--on-night-strong); } .night .figure { color: var(--brand-primary-on-dark); }
    .lead { font-size: 34px; margin-top: 28px; max-width: 820px; color: var(--text-primary); }
    .night .lead { color: var(--brand-on-night); }
    .rule { height: 1px; background: var(--border); margin: 48px 0 24px; }
    .night .rule { background: var(--rule-on-night); }
    .foot { display: flex; justify-content: space-between; align-items: center; }
    .caption { font-size: 20px; }
    .logo { display: block; width: 202px; height: auto; } /* lockup ≈ 200px */
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow" data-field="eyebrow">Gragi</div>
    <h1 class="headline"><span data-field="headline">Gragi responde en</span> <br data-field="headline_break"><span class="remate" data-field="remate">10 segundos.</span></h1>
    <p class="lead" data-field="lead">Lo que tarda Gragi en decirte qué cursos bajaron el promedio este trimestre.</p>
    <div class="rule"></div>
    <div class="foot">
      <p class="caption" data-field="caption">Fuente: Gragica, colegio de demostración.</p>
      <img class="logo" data-logo src="../logos/gragica-lockup-h.svg" alt="Gragica">
    </div>
  </div>

  <script>
    // Llena los [data-field] desde el bloque #piece. Editá solo el JSON de arriba.
    (function () {
      var p = JSON.parse(document.getElementById("piece").textContent);
      document.documentElement.style.setProperty("--w", p.width + "px");
      document.documentElement.style.setProperty("--h", p.height + "px");
      if (p.background && p.background !== "paper") document.body.classList.add(p.background);
      document.querySelectorAll("[data-field]").forEach(function (el) {
        var k = el.getAttribute("data-field");
        if (k === "headline_break") {
          if (!p.headline_break) el.remove();
        } else if (k === "screenshot") {
          if (p.screenshot) el.src = p.screenshot; else el.closest(".frame").remove();
        } else if (k === "headline") {
          var h = p.headline || "", r = p.remate || "";
          el.textContent = r && h.slice(-r.length) === r ? h.slice(0, -r.length).trim() : h;
        } else if (p[k] !== undefined) {
          if (p[k] === "" || p[k] === null) el.remove(); else el.textContent = p[k];
        }
      });
      var night = document.body.classList.contains("night");
      document.querySelectorAll("img[data-logo]").forEach(function (logo) {
        var src = logo.getAttribute("src"), white = /-white\.svg$/.test(src);
        if (night && !white) logo.setAttribute("src", src.replace(/(-ink-word|-ink)?\.svg$/, "-white.svg"));
        if (!night && white) logo.setAttribute("src", src.replace(/-white\.svg$/, ".svg"));
      });
    })();
  </script>
</body>
</html>
